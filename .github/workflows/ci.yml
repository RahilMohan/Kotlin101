name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build All Projects
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Verify Gradle
        run: gradle --version

      - name: Build all projects
        run: |
          set -e
          for dir in src/*/; do
            if [ -f "$dir/build.gradle.kts" ]; then
              echo "Building $dir"
              (cd "$dir" && gradle build --no-daemon --console=plain)
            fi
          done

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: src/*/build/reports/
          retention-days: 7
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build All Projects
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '9.8.2'

      - name: Build all projects
        run: |
          set -uo pipefail
          failures=()
          for dir in src/*/; do
            [ -f "$dir/build.gradle.kts" ] || continue
            echo "::group::Building $dir"
            if (cd "$dir" && ./gradlew build --no-daemon --console=plain --stacktrace); then
              echo "PASS: $dir"
            else
              echo "::error::Build failed for $dir"
              failures+=("$dir")
            fi
            echo "::endgroup::"
          done

          echo "=== BUILD SUMMARY ==="
          echo "Total projects: $(find src -maxdepth 2 -name build.gradle.kts | wc -l)"
          echo "Failed projects: ${#failures[@]}"
          for f in "${failures[@]:-}"; do
            [ -n "$f" ] && echo " - $f"
          done

          if [ "${#failures[@]}" -gt 0 ]; then
            exit 1
          fi

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: build-reports
          path: src/*/build/reports/
          retention-days: 7
          if-no-files-found: ignore

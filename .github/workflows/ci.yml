name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build All Projects
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.8.2'

      - name: Build all projects
        run: |
          set -uo pipefail
          failures=()
          for dir in src/*/; do
            [ -f "$dir/build.gradle.kts" ] || continue
            echo "::group::Building $dir"
            if (cd "$dir" && ./gradlew build --no-daemon --console=plain --stacktrace); then
              echo "PASS: $dir"
            else
              echo "::error::Build failed for $dir"
              failures+=("$dir")
            fi
            echo "::endgroup::"
          done

          echo "=== BUILD SUMMARY ==="
          echo "Total projects: $(find src -maxdepth 2 -name build.gradle.kts | wc -l)"
          echo "Failed projects: ${#failures[@]}"
          for f in "${failures[@]:-}"; do
            [ -n "$f" ] && echo " - $f"
          done

          if [ "${#failures[@]}" -gt 0 ]; then
            exit 1
          fi

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: src/*/build/reports/
          retention-days: 7
          if-no-files-found: ignore
